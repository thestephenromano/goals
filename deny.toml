# cargo-deny policy for the Goals workspace, run by CI's lint job.

[graph]
all-features = true

[advisories]
# Every RustSec advisory that affects a dependency fails the check. An
# exception goes in `ignore` with the advisory id, a reason, and when it can
# be removed.
ignore = []

[licenses]
# Goals is MIT OR Apache-2.0; dependencies may use these licences.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # option-ext, through dirs (as in Matters).
    "MPL-2.0",
    "Unicode-3.0",
    # jiff is Unlicense OR MIT.
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported, not refused: they come and go with
# upstream releases and are a size cost, not a correctness one.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Dependencies come from crates.io only. The Matters sync crates will be
# added here, by git revision, when sync arrives (thestephenromano/matters#46).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
